<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CryptoTerminal Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0a0f1c;
  color:#FFFFFF;
}

/* Header */
header{
  background:#111827;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:700;
  border-bottom:1px solid #1f2937;
}

/* Ticker */
.ticker-wrapper{
  overflow:hidden;
  background:#0f172a;
  border-bottom:1px solid #1f2937;
}
.ticker{
  display:inline-block;
  white-space:nowrap;
  padding:14px 0;
  animation:scroll 30s linear infinite;
}
.ticker-item{
  display:inline-block;
  margin-right:70px;
}
@keyframes scroll{
  from{ transform:translateX(100%);}
  to{ transform:translateX(-100%);}
}

/* News Grid */
.news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:20px;
  max-width:1300px;
  margin:0 auto;
}

.card{
  background:#111827;
  border-radius:10px;
  overflow:hidden;
  transition:0.3s;
}
.card:hover{ transform:scale(1.03);}
.card img{ width:100%; height:180px; object-fit:cover;}
.content{ padding:15px;}
.source{ font-size:11px; opacity:0.6; margin-bottom:6px; }

/* Live Market Section */
.live-market{
  background:#0f172a;
  border-top:1px solid #1f2937;
  padding:20px;
  max-width:1300px;
  margin:20px auto 80px auto;
}
.section-title{
  font-size:14px;
  opacity:0.6;
  text-transform:uppercase;
  margin-bottom:10px;
}
.market-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}
.positive{color:#00ff9d;}
.negative{color:#ff4d4d;}

/* Bottom Nav */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  border-top:1px solid #1f2937;
}
.bottom-nav button{
  background:none;
  border:none;
  color:#FFFFFF;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
}
.bottom-nav button:hover{ color:#00ff9d; }

/* Responsive */
@media(max-width:1100px){ .news-grid{ grid-template-columns:repeat(2,1fr);} }
@media(max-width:700px){ .news-grid{ grid-template-columns:1fr; padding:15px;} .live-market{ padding:15px;} }
</style>
</head>
<body>

<header>CryptoTerminal Pro</header>

<!-- Ticker -->
<div class="ticker-wrapper"><div class="ticker" id="ticker"></div></div>

<!-- News -->
<div class="news-grid" id="news"></div>

<!-- Live Market -->
<div class="live-market">
  <div class="section-title">Live Market</div>
  <div id="market"></div>

  <div class="section-title">Top Gainers</div>
  <div id="gainers"></div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button onclick="refreshAll()">🔄 Refresh</button>
  <button onclick="document.getElementById('gainers').scrollIntoView({behavior:'smooth'})">💹 Top Coins</button>
  <button onclick="document.getElementById('news').scrollIntoView({behavior:'smooth'})">📰 News</button>
</div>

<script>
// ===== TICKER =====
async function loadTicker(){
  try{
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin,ripple,cardano&vs_currencies=usd&include_24hr_change=true");
    const data = await res.json();
    const coins = { BTC:data.bitcoin, ETH:data.ethereum, SOL:data.solana, BNB:data.binancecoin, XRP:data.ripple, ADA:data.cardano };
    let html="";
    for(let c in coins){
      const ch = coins[c].usd_24h_change;
      const cls = ch>=0?"positive":"negative";
      html+=`<span class="ticker-item"><strong>${c}</strong> $${coins[c].usd} <span class="${cls}">(${ch.toFixed(2)}%)</span></span>`;
    }
    document.getElementById("ticker").innerHTML=html;
  }catch(e){ console.error(e);}
}

// ===== LIVE MARKET =====
async function loadMarket(){
  try{
    const res = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false");
    const data = await res.json();
    let mhtml="", ghtml="";
    data.forEach((c,i)=>{
      const cls = c.price_change_percentage_24h>=0?"positive":"negative";
      mhtml+=`<div class="market-item"><span>${c.symbol.toUpperCase()}</span><span>$${c.current_price} <span class="${cls}">(${c.price_change_percentage_24h.toFixed(2)}%)</span></span></div>`;
      if(i<5){
        ghtml+=`<div class="market-item"><span>${c.symbol.toUpperCase()}</span><span class="positive">${c.price_change_percentage_24h.toFixed(2)}%</span></div>`;
      }
    });
    document.getElementById("market").innerHTML=mhtml;
    document.getElementById("gainers").innerHTML=ghtml;
  }catch(e){ console.error(e);}
}

// ===== NEWS =====
async function loadNews(){
  try{
    const res = await fetch("https://api.coingecko.com/api/v3/news");
    const data = await res.json();
    const articles = data.data.slice(0,30);
    let html="";
    articles.forEach(n=>{
      html+=`<div class="card"><a href="${n.url}" target="_blank"><img src="${n.image || 'https://images.unsplash.com/photo-1611078489787-6f5b7b96a2e3?fit=crop&w=400&h=200'}"><div class="content"><div class="source">Source: ${n.source_name}</div><h4>${n.title}</h4><p>${n.text.substring(0,110)}...</p></div></a></div>`;
    });
    document.getElementById("news").innerHTML=html;
  }catch(e){
    console.error("Error loading news",e);
    document.getElementById("news").innerHTML="<p style='text-align:center;'>News unavailable</p>";
  }
}

// ===== REFRESH ALL =====
function refreshAll(){
  loadTicker();
  loadMarket();
  loadNews();
}

refreshAll();
setInterval(refreshAll,60000);
</script>

</body>
</html>
